<!doctype html><meta charset=utf-8><body style="background:#fff">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.4.1/mermaid.min.js"></script>
<div id=out></div>
<script>
const blocks=["flowchart TB\n    subgraph agents[\"Agents\"]\n        A1[\"WebMCP-native host<br/>ChatGPT in-app browser,<br/>Chrome 149+ w/ flag\"]\n        A2[\"Headless / remote agent<br/>JSON-RPC over WebSocket\"]\n        A3[\"Browser-automation agent<br/>polyfill + JS eval\"]\n    end\n\n    subgraph server[\"server.mjs :8060\"]\n        S1[\"Static /public<br/>COOP + COEP\"]\n        S2[\"/api/mcp/tools<br/>/api/mcp/rpc<br/>read-only discovery\"]\n        S3[\"/mcp WebSocket broker<br/>routes agent to editor\"]\n    end\n\n    subgraph page[\"The browser tab \u2014 where all state lives\"]\n        B[\"mcp_bridge.js<br/>52 tools, activeFilesDict,<br/>sceneRevision, DiagnosticState\"]\n        subgraph engines[\"Two separate Engine instances\"]\n            E1[\"Editor Engine<br/>godot.editor.wasm\"]\n            E2[\"Playtest Engine<br/>own virtual FS\"]\n        end\n        P[\"addons/webmcp/plugin.gd<br/>@tool EditorPlugin\"]\n        DB[(\"IndexedDB<br/>project library\")]\n    end\n\n    A1 -->|document.modelContext| B\n    A2 --> S3 --> B\n    A3 -->|__webmcp.call| B\n    A1 -.discovery.-> S2\n    A2 -.discovery.-> S2\n\n    B <-->|JavaScriptBridge| P\n    P --- E1\n    B -->|staged snapshot + launch token| E2\n    B <--> DB\n    S1 -.serves.-> page\n\n    classDef ag fill:#dbeafe,stroke:#1e40af,color:#0b1220\n    classDef sv fill:#fef3c7,stroke:#92400e,color:#0b1220\n    classDef br fill:#dcfce7,stroke:#166534,color:#0b1220\n    classDef en fill:#fae8ff,stroke:#6b21a8,color:#0b1220\n    class A1,A2,A3 ag\n    class S1,S2,S3 sv\n    class B,DB br\n    class E1,E2,P en\n", "flowchart LR\n    T[\"Agent tool call\"] --> D{\"What does it touch?\"}\n\n    D -->|\"selection, live node<br/>add / move / recolour / delete,<br/>property + camera reads\"| C[\"<b>Command channel</b><br/>EditorCommandChannel<br/>via plugin.gd + UndoRedo\"]\n    D -->|\"transient viewport framing\"| G[\"<b>Guidance channel</b><br/>CameraGuidance\"]\n    D -->|\"whole-file writes,<br/>project creation, deletes,<br/>binary assets\"| X[\"<b>Transaction channel</b><br/>godot_apply_file_transaction\"]\n\n    C --> C1[\"Mutates scene: yes<br/>Restarts editor: <b>no</b>\"]\n    G --> G1[\"Mutates scene: no<br/>Restarts editor: no\"]\n    X --> X1[\"Mutates scene: yes, via .tscn text<br/>Restarts editor: <b>yes</b>\"]\n\n    classDef q fill:#fef3c7,stroke:#92400e,color:#0b1220\n    classDef cc fill:#dcfce7,stroke:#166534,color:#0b1220\n    classDef gc fill:#dbeafe,stroke:#1e40af,color:#0b1220\n    classDef xc fill:#fee2e2,stroke:#991b1b,color:#0b1220\n    class D q\n    class C,C1 cc\n    class G,G1 gc\n    class X,X1 xc\n", "flowchart TD\n    W[\"Write request\"] --> Q1{\"GDScript-only?\"}\n    Q1 -->|yes| H[\"<b>Hot script channel</b>\"]\n    Q1 -->|\"no \u2014 project.godot, deletes,<br/>renames, binaries, mixed\"| R[\"<b>Editor replacement</b>\"]\n\n    H --> H1[\"Copy candidate bytes into the<br/><i>running</i> Engine, double-fenced on<br/>lifecycle + command generation\"]\n    H1 --> H2[\"plugin.gd refreshes and recompiles<br/>on a deferred editor frame\"]\n    H2 --> H3{\"Godot's own sha256 +<br/>reload result agree?\"}\n    H3 -->|yes| OK[\"Persist candidate \u2192 publish<br/>activeFilesDict + sceneRevision\"]\n    H3 -->|\"no \u2014 compile failure\"| RB[\"Restore previous bytes<br/>through the same channel.<br/>Revision untouched.\"]\n    RB --> RB2{\"Restore acknowledged?\"}\n    RB2 -->|no| DU[\"session = dirty_unpersisted\"]\n\n    R --> R1[\"Build candidate project\"]\n    R1 --> R2[\"Await previous Engine's real onExit<br/>(25s budget of <b>active</b> time)\"]\n    R2 --> R3[\"Boot new Engine, inject plugin,<br/>copy files\"]\n    R3 --> R4{\"Runtime boot valid?<br/>no FATAL:\"}\n    R4 -->|yes| OK\n    R4 -->|no| RO[\"Roll back both.<br/>Publish nothing.\"]\n\n    classDef hot fill:#dcfce7,stroke:#166534,color:#0b1220\n    classDef cold fill:#fee2e2,stroke:#991b1b,color:#0b1220\n    classDef good fill:#dbeafe,stroke:#1e40af,color:#0b1220\n    classDef bad fill:#fef3c7,stroke:#92400e,color:#0b1220\n    class H,H1,H2,H3 hot\n    class R,R1,R2,R3,R4 cold\n    class OK good\n    class RB,RB2,DU,RO bad\n", "stateDiagram-v2\n    [*] --> idle\n    idle --> initializing: runEditorBoot\n    initializing --> running: start() resolved\n    initializing --> failed: init/start rejected\n    running --> quitting: requestQuit()\n    quitting --> exited: real onExit\n    quitting --> failed: exit never arrives\n    exited --> initializing: next boot\n    failed --> [*]: reload page\n\n    note right of quitting\n        No same-page takeover in\n        ANY non-terminal state.\n        Replacement is serialized by\n        editorReplacementInFlight.\n    end note\n\n    note right of failed\n        editorRestartBlocked latches.\n        restoreProjectSnapshot restores\n        IN MEMORY ONLY and marks the\n        session restart_required.\n        A rollback must never build an\n        Engine after a timeout.\n    end note\n", "sequenceDiagram\n    autonumber\n    participant A as Agent\n    participant B as mcp_bridge.js\n    participant E as Editor Engine\n    participant G as Game Engine\n\n    A->>B: godot_run_game\n    B->>E: serialize .tscn, __godotSyncToFS\n    B->>B: stage __godotStagedProject<br/>{revision, fingerprint, launchToken, files}\n    B->>G: new Engine(gameConfig), init()\n    G->>B: read staged snapshot \u2014 CLEARED ON READ\n    G->>G: copy bytes into its own FS\n    G-->>B: __godotGameFsAck { launchToken,<br/>sha256 of bytes ACTUALLY copied }\n    B->>B: verifyPlaytestAcknowledgement:<br/>token \u00b7 revision \u00b7 file count \u00b7<br/>fingerprint \u00b7 freshness\n    alt all five agree\n        B->>G: start()\n        B-->>A: running\n    else any mismatch\n        B-->>A: PLAYTEST_REVISION_UNCONFIRMED<br/>+ handshake_code\n    end\n", "flowchart TD\n    Q{\"Does your agent's browser<br/>implement WebMCP natively?\"}\n    Q -->|yes| N[\"<b>Route A \u2014 native</b><br/>Tools are already registered<br/>on document.modelContext.<br/>Nothing to do.\"]\n    Q -->|\"no, but it can<br/>eval JS in the page\"| P[\"<b>Route B \u2014 polyfill</b><br/>Paste test/webmcp-polyfill.js,<br/>then await __webmcp.reload()\"]\n    Q -->|\"no, it's headless<br/>or remote\"| W[\"<b>Route C \u2014 WebSocket relay</b><br/>ws://localhost:8060/mcp?type=agent<br/>JSON-RPC 2.0 tools/call\"]\n\n    classDef qq fill:#fef3c7,stroke:#92400e,color:#0b1220\n    classDef aa fill:#dcfce7,stroke:#166534,color:#0b1220\n    class Q qq\n    class N,P,W aa\n"];
window.results=[];
(async()=>{
 mermaid.initialize({startOnLoad:false});
 for(let i=0;i<blocks.length;i++){
  try{ const {svg}=await mermaid.render('d'+i, blocks[i]); document.getElementById('out').innerHTML+='<h3>#'+i+' OK</h3>'+svg; window.results.push({i,ok:true}); }
  catch(e){ window.results.push({i,ok:false,err:String(e&&e.message||e)}); document.getElementById('out').innerHTML+='<h3>#'+i+' FAIL</h3><pre>'+String(e)+'</pre>'; }
 }
 window.done=true;
})();
</script></body>
